name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the dashboard
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.6
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build

      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: tar -czf "linux-all-casaos-${RELEASE_TAG}.tar.gz" build

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: linux-all-casaos-${{ github.ref_name }}.tar.gz
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
